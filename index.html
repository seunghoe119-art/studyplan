<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="소방승진시험 대비 3회독 학습 관리 웹앱 — D-day, 타이머, 진행률, 숫자 암기 시트" />
<meta name="theme-color" content="#E63946" />
<title>소방전술 작전판</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" />
<link rel="stylesheet" href="app/styles.css" />
</head>

<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>🚒 소방전술 작전판</h1>
      <span class="tagline">승진시험 학습 관리</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div id="root"></div>

  <div class="foot-note">
    스케줄은 2026-09-05(토) 시작 · 2026-11-07(토) 시험일 기준 자동 계산 · 모든 데이터는 이 브라우저에만 저장됨 (설정에서 백업 가능)
  </div>
</div>

<nav class="tabbar" role="tablist" aria-label="화면 전환" id="tabbar"></nav>

<div id="modal-root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Schedule engine (plain JS) -->
<script src="app/schedule.js"></script>

<!-- UI components -->
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/Dashboard.jsx"></script>
<script type="text/babel" src="app/Timer.jsx"></script>
<script type="text/babel" src="app/Progress.jsx"></script>
<script type="text/babel" src="app/Settings.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const F = window.FT;

function App() {
  const [store, setStore] = useState(() => F.loadStore());
  const [tab, setTab] = useState(() => {
    try {
      const saved = localStorage.getItem('ft_tab') || 'home';
      return saved === 'numbers' ? 'home' : saved;
    } catch { return 'home'; }
  });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [timerDayIdx, setTimerDayIdx] = useState(null);

  // 전역 참조 (ChartSVG 등에서 사용)
  window.__STORE__ = store;

  // 초기 테마/액센트 적용
  useEffect(() => {
    applyTheme(store.theme);
    applyAccent(store.accent);
  }, []);

  useEffect(() => {
    try { localStorage.setItem('ft_tab', tab); } catch {}
  }, [tab]);

  // 설정 버튼 hookup
  useEffect(() => {
    const el = document.getElementById('settingsBtn');
    if (!el) return;
    const h = () => setSettingsOpen(true);
    el.addEventListener('click', h);
    return () => el.removeEventListener('click', h);
  }, []);

  const onStartToday = (idx) => {
    setTimerDayIdx(idx);
    setTab('timer');
  };

  return (
    <>
      {tab === 'home'     && <Dashboard    store={store} setStore={setStore} onNav={setTab} onStartToday={onStartToday} />}
      {tab === 'timer'    && <Timer        store={store} setStore={setStore} initialDayIdx={timerDayIdx} />}
      {tab === 'progress' && <ProgressView store={store} />}

      <TabBar tab={tab} onChange={setTab} />

      <SettingsModal
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        store={store}
        setStore={setStore}
      />
    </>
  );
}

function TabBar({ tab, onChange }) {
  const tabs = [
    { key: 'home',     label: '홈',     icon: Icons.home },
    { key: 'timer',    label: '타이머', icon: Icons.timer },
    { key: 'progress', label: '진행률', icon: Icons.chart },
  ];
  return ReactDOM.createPortal(
    <div className="tabbar-inner">
      {tabs.map(t => {
        const I = t.icon;
        const active = tab === t.key;
        return (
          <button
            key={t.key}
            className="tab"
            role="tab"
            aria-selected={active}
            onClick={() => onChange(t.key)}
          >
            <span className="ticon"><I size={20} /></span>
            <span>{t.label}</span>
          </button>
        );
      })}
    </div>,
    document.getElementById('tabbar')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
